name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Turbo Remote Caching to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching
env:
  FORCE_COLOR: 3
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # Scope turbo runs to packages a PR actually changed, plus their dependents.
  # A change outside any package (root config, lockfile) invalidates the whole
  # graph, so this cannot silently skip work. Pushes to `main` run everything,
  # which is what keeps the remote cache populated for laptops and later PRs.
  AFFECTED_FLAG: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'main' }}

jobs:
  # Mirrors Bitbucket "Checking Code"
  lint:
    needs: build
    # Still report when the build breaks.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` diffs against TURBO_SCM_BASE, which needs real history.
          fetch-depth: 0

      # Turbo decides by input hash and never inspects whether outputs already
      # exist, so restoring `dist/` would not help — its own cache is the thing
      # to share. Produced by `build` in this same run and expiring with it, so
      # Vercel stays the only durable cache. Falls through to Vercel if absent.
      - name: Restore turbo cache from build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: turbo-cache
          path: .turbo/cache

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint && pnpm lint:ws

      # Out of the shared `pnpm lint` because it is a rule about *this* repo:
      # the inventory it enforces is the bank's own and reaches no consumer, so
      # in a consumer's lint it could only ever no-op. Named here instead, so
      # it still runs on every PR that could leave a root entry unclassified.
      - name: Bank paths
        run: pnpm check:bank-paths

  typecheck:
    needs: build
    # Still report when the build breaks.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` diffs against TURBO_SCM_BASE, which needs real history.
          fetch-depth: 0

      # See the lint job for why this shares turbo's cache and not `dist/`.
      - name: Restore turbo cache from build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: turbo-cache
          path: .turbo/cache

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        # Stubs satisfy module-level infrastructure client constructors without
        # making real connections. IS_NEXT_BUILD skips T3 validation so these
        # bypass T3 entirely and only serve Mastra/AI SDK constructor guards.
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: stub
          DB_PASSWORD: stub
          DB_NAME: stub
          DB_VECTOR_NAME: stub
          NEXT_PUBLIC_WEBAPP: stub
          REDIS_URL: redis://localhost:6379
          LLM_PROVIDER: ollama
          EMBED_PROVIDER: ollama
          EMBED_DIMENSIONS: 768
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_CHAT_MODEL: stub
          OLLAMA_EMBED_MODEL: stub
        run: pnpm typecheck

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Boundaries
        run: pnpm boundaries

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` diffs against TURBO_SCM_BASE, which needs real history.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format
        run: pnpm format

  test-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test policy
        run: pnpm test:policy

  deps-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deps lint (syncpack)
        run: pnpm deps:lint

  # Report-only: surfaces dead code / unused deps. Non-blocking until baselined.
  deps-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Dead code / unused deps (knip)
        run: pnpm deps:check

  # Report-only: surfaces copy-paste within packages/. Non-blocking.
  duplication:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Duplication (jscpd)
        run: pnpm dup

  # Mirrors Bitbucket "Testing Code"
  test:
    needs: build
    # Still report when the build breaks.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` diffs against TURBO_SCM_BASE, which needs real history.
          fetch-depth: 0

      # See the lint job for why this shares turbo's cache and not `dist/`.
      - name: Restore turbo cache from build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: turbo-cache
          path: .turbo/cache

      - name: Setup
        uses: ./.github/actions/setup

      # The bank:contribute suite asserts that the outbound secret scan really
      # blocks a leaking diff, so it needs the real binary rather than a skip.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Test
        run: pnpm test

  # Mirrors Bitbucket "Building Code"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `--affected` diffs against TURBO_SCM_BASE, which needs real history.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        # Stubs — see the typecheck job above.
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: stub
          DB_PASSWORD: stub
          DB_NAME: stub
          DB_VECTOR_NAME: stub
          NEXT_PUBLIC_WEBAPP: stub
          REDIS_URL: redis://localhost:6379
          LLM_PROVIDER: ollama
          EMBED_PROVIDER: ollama
          EMBED_DIMENSIONS: 768
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_CHAT_MODEL: stub
          OLLAMA_EMBED_MODEL: stub
        run: pnpm build

      # Hands this run's build results to lint/typecheck/test so they resolve
      # `^build` off local disk instead of re-querying the remote cache.
      - name: Share turbo cache
        uses: actions/upload-artifact@v4
        with:
          name: turbo-cache
          path: .turbo/cache
          retention-days: 1
          if-no-files-found: ignore

  # --- Security hardening ---

  # Secret scanning over the full git history
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  # Dependency vulnerability audit — blocking gate on high/critical
  # (../../docs/adr/0027-dependency-audit-gate-and-suppression-policy.md)
  audit:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: pnpm audit
        run: pnpm run audit

  # Review dependency changes introduced by a PR (vulnerabilities + licenses)
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
