# gitleaks configuration — https://github.com/gitleaks/gitleaks
# Extends the bundled default ruleset and adds repo-specific allowlisting.
title = "acme"

[extend]
useDefault = true

[allowlist]
description = "Ignore example/placeholder env files, the lockfile, and localstripe dev placeholders"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.production$''',
  '''(^|/)\.env\.staging$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
# Fixed, non-secret placeholders for the local dev localstripe server (no real
# Stripe account/keys involved). See docs/adr/0003.
#
# Publishable keys (Clerk/Stripe `pk_test_`/`pk_live_`) are non-secret by design —
# they ship in the browser bundle. Config-as-code (ADR 0026) moved them out of the
# path-allowlisted `.env.*` files into code, and ADR 0033 folded that into each
# slice's `env.ts` as an authored profile value, so allowlist the prefix.
regexes = [
  '''sk_test_localstripe''',
  '''whsec_localstripe''',
  '''pk_test_localstripe''',
  # Publishable keys (Stripe/Clerk `pk_test_`/`pk_live_`) are PUBLIC by design —
  # they ship in the client bundle — and now live in config-as-code (ADR 0026)
  # rather than env, so the entropy-based generic rule must not flag them. Only
  # publishable (`pk_`) keys; secret keys (`sk_`, `whsec_`) stay caught.
  '''pk_(test|live)_[A-Za-z0-9]+''',
]
