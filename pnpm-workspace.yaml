  # dep rarely matches; the `@tanstack/query-core` override below forces a single
  # copy so the persister's QueryClient brand matches react-query's. See ADR 0025.
  "@tanstack/query-persist-client-core": 5.90.2
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.87.1
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.0
  "@testing-library/user-event": ^14.6.1
  "@trpc/client": ^11.8.0
  "@trpc/react-query": ^11.8.0
  "@trpc/server": ^11.8.0
  "@trpc/tanstack-react-query": ^11.8.0
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": ^5.1.1
  "@xmldom/xmldom": ^0.9.8
  ai: ^6.0.204
  bullmq: ^5.80.0
  clsx: ^2.1.0
  drizzle-orm: ^0.45.2 # GHSA-gpj5-g38j-94v9 (SQL injection) patched >=0.45.2
  drizzle-zod: ^0.8.3
