  msw: ^2.11.5
  msw-trpc: ^2.0.1
  next: ^15.5.22 # GHSA-{m99w-x7hq-7vfj,89xv-2m56-2m9x,p9j2-gv94-2wf4,…} patched >=15.5.21
  next-themes: ^0.4.6
  officeparser: ^7.5.1
  p-limit: 7.2.0
  pgvector: ^0.2.0
