catalogMode: strict

catalogs:
  react19:
    "@types/react": ^19.2.0
    "@types/react-dom": ^19.2.0
    react: ^19.2.0
    react-dom: ^19.2.0

linkWorkspacePackages: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild

patchedDependencies:
  # The persister's background-revalidation fires a floating `query.fetch()`
  # (createPersister.js) and `Query.fetch()` re-throws on failure — so with
  # `staleTime: 0` (chat's QueryClient, needed so a recent persisted snapshot
  # still revalidates) a failed offline refetch becomes an unhandled rejection.
  # The patch adds `.catch()`. Re-verify on any persister bump (ADR 0025).
  "@tanstack/query-persist-client-core@5.90.2": patches/@tanstack__query-persist-client-core@5.90.2.patch

overrides:
  # Force a single @tanstack/query-core so the per-query persister
  # (@tanstack/query-persist-client-core) and react-query share one QueryClient
  # brand — without this they resolve two copies whose #private fields clash.
  # Pinned to react-query's exact query-core; bump in lockstep if react-query
  # moves (ADR 0025).
  "@tanstack/query-core": 5.90.16
  "@types/minimatch": 5.1.2
  import-in-the-middle: 2.0.4
  require-in-the-middle: 8.0.1
  vite: "catalog:"
  vitest: "catalog:"
  qs: 6.14.1
  "@clerk/backend": "catalog:"
  # --- Security overrides (ADR 0027): force patched transitive versions whose
  # parent hasn't shipped a fix. Ranges (not hard pins) so parents can still
  # move; each carries its GHSA. Leaves with multiple in-tree majors use
  # version-range selectors (`pkg@>=x <y`) with a concrete target, so a fix on
  # one line can't force an incompatible major onto another. ---
  fast-xml-parser: ">=5.10.1" # GHSA-8r6m-32jq-jx6q (@aws-sdk)
  "@grpc/grpc-js": ">=1.14.4" # GHSA-5375-pq7m-f5r2, GHSA-99f4-grh7-6pcq (@a2a-js/sdk)
  fast-uri: ">=3.1.5 <4" # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7; kept on 3.x (ajv peers ^3.0.1)
  ip-address: ">=10.3.1" # GHSA-mwp4-54f8-5fhr (@modelcontextprotocol/sdk>express-rate-limit)
  # pdfjs-dist: officeparser hard-pins an exact version, and even its latest
  # (7.5.1) pins a still-vulnerable 6.1.200 — so bumping the parent alone can't
  # clear this. The catalog is bumped to ^7.5.1 so officeparser is already on the
  # 6.x line, which keeps this override a within-major bump rather than a
  # cross-major force onto a parent expecting 5.x.
  pdfjs-dist: ">=6.2.108" # GHSA-hq66-cqwq-w95j (rag>officeparser)
  shell-quote: ">=1.9.0" # GHSA-395f-4hp3-45gv (mastra CLI)
  lodash: ">=4.18.0" # GHSA-r5fr-rjxr-66jc (mastra CLI>archiver)
  tmp: ">=0.2.6" # GHSA-ph9p-34f9-6g65 (testcontainers)
  flatted: ">=3.4.2" # GHSA-rf6f-7fwh-wjgh (eslint>file-entry-cache)
  sharp: ">=0.35.0" # GHSA-f88m-g3jw-g9cj (next optional dep)
  undici: ">=6.27.0" # GHSA-vxpw-j846-p89q +chain (testcontainers, test-only)
  # postcss forced tree-wide: next pins 8.4.31 and the apps declare 8.5.6.
  postcss: ">=8.5.18" # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849
  # nanoid: only the 3.x line is in tree (under postcss). Range-selected so a
  # future 5.x consumer isn't dragged back onto 3.x.
  "nanoid@>=3.0.0 <3.3.18": "3.3.18" # GHSA-2v37-7h3g-55p8
  # protobufjs: whole tree is on the 8.x line (grpc proto-loader + otel).
  protobufjs: ">=8.4.1" # GHSA-wcpc-wj8m-hjx6 +chain, incl critical GHSA-xq3m-2v4x-88gg
  # minimatch: 3.x (eslint-plugin-import), 5.x (readdir-glob), 9.x (glob) lines
  "minimatch@>=3.0.0 <3.1.4": "3.1.4" # GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74
  "minimatch@>=5.0.0 <5.1.8": "5.1.8" # same advisories, 5.x line
  "minimatch@>=9.0.0 <9.0.7": "9.0.7" # same advisories, 9.x line
  # brace-expansion: three lines in tree — 1.x/2.x (mastra CLI
  # archiver/serve-handler, and minimatch under eslint) and 5.x (glob@13's
  # minimatch). Each kept within-major: v5 switched to a named CJS export, which
  # breaks the `require(...)` default import in the minimatch versions the 1.x/2.x
  # consumers pin, so they can't be collapsed onto one line (see
  # auditConfig.ignoreGhsas below). These clear GHSA-3jxr and GHSA-rgw5.
  "brace-expansion@>=1.0.0 <1.1.18": "1.1.18" # GHSA-3jxr-9vmj-r5cp, GHSA-rgw5-rvv9-x895 (1.x)
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4" # GHSA-3jxr-9vmj-r5cp, GHSA-rgw5-rvv9-x895 (2.x)
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9" # GHSA-rgw5-rvv9-x895 (5.x, glob@13>minimatch)
  # picomatch: 2.x (mastra deployer>fast-glob) and 4.x (vitest) lines
  "picomatch@>=2.0.0 <2.3.2": "2.3.2" # GHSA-c2c7-rcm5-vvqj
  "picomatch@>=4.0.0 <4.0.4": "4.0.4" # GHSA-c2c7-rcm5-vvqj
  # js-yaml: 3.x (@mastra/core>gray-matter) and 4.x (eslint>@eslint/eslintrc) lines
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1" # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1" # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj

# Audit allowlist (ADR 0027) — last resort: no compatible reachable patch.
auditConfig:
  ignoreGhsas:
    # brace-expansion ReDoS. npm marks every version <=5.0.7 vulnerable; the only
    # fix (5.0.8) ships a named CJS export that breaks the `require()` default
    # import in the minimatch versions our tree pins (eslint-plugin-import@2,
    # readdir-glob, archiver's glob) — verified by "expand is not a function"
    # across all lint tasks. No fix compatible with these parents exists. Reached
    # only through build/dev tooling (eslint, mastra CLI archiver) on
    # non-attacker-controlled glob patterns. Re-check when those parents move to
    # a minimatch that consumes brace-expansion 5.x. Added 2026-07-28.
    - GHSA-mh99-v99m-4gvg
    # image-size DoS (infinite loop) in the ICNS parser and the JXL/HEIF parsers.
    # npm reports `patched: <0.0.0` — no fixed version exists on any line, and
    # latest (2.0.2) is itself vulnerable, so neither an override nor a parent
    # bump can clear it. Reached only through `@mastra/memory`, which reads
    # dimensions of images already inside a conversation's own memory store; we
    # never hand it attacker-supplied ICNS/JXL/HEIF. Drop both entries when
    # image-size ships a fix. Added 2026-08-14.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
